name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Find Project and Build
      run: |
        # settings.gradle বা build.gradle যেখানে আছে সেই ডিরেক্টরি বের করা
        CONFIG_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | grep -v "/app/" | head -n 1)
        
        if [ -n "$CONFIG_FILE" ]; then
          TARGET_DIR=$(dirname "$CONFIG_FILE")
        else
          TARGET_DIR="."
        fi
        
        echo "Moving into project directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        ls -la
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CN-Upscaler-Debug
        path: "**/build/outputs/apk/debug/*.apk"
