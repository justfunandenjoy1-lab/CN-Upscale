name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Locate and Build Debug APK
      run: |
        echo "Searching for settings.gradle or build.gradle..."
        TARGET_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR=$(find . -name "build.gradle*" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
        fi

        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR="."
        fi

        echo "Switching to directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        ls -la
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CN-Upscaler-Debug
        path: "**/build/outputs/apk/debug/*.apk"
