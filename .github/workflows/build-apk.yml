name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Extract Project Zip and Build
      run: |
        if [ -f "CN-Upscaler.zip" ]; then
          echo "Extracting CN-Upscaler.zip..."
          unzip -o CN-Upscaler.zip
        elif [ -f "cnupscaler.zip" ]; then
          echo "Extracting cnupscaler.zip..."
          unzip -o cnupscaler.zip
        fi

        PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR=$(find . -name "build.gradle*" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
        fi

        echo "Building inside directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # AndroidX সক্রিয় করতে gradle.properties এ ফ্ল্যাগ যোগ করা
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CN-Upscaler-Debug
        path: "**/build/outputs/apk/debug/*.apk"
