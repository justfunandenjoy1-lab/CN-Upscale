# প্রজেক্ট ফোল্ডারে প্রবেশ করুন
cd cnupscaler

# গিট ইনিশিয়ালাইজ করুন (না করা থাকলে)
git init

# ফাইলগুলো স্টেজিং এরিয়াতে যোগ করুন
git add .

# পরিবর্তনগুলো কমিট করুন
git commit -m "Setup project and APK build workflow"

# গিটহাব রিপোজিটরির মেইন ব্রাঞ্চ সেট করুন
git branch -M main

# আপনার গিটহাব রিপোজিটরির লিংক যোগ করুন (YOUR_USERNAME এবং REPO_NAME পরিবর্তন করুন)
git remote add origin https://github.com/YOUR_USERNAME/REPO_NAME.git

# গিটহাবে পুশ করুন
git push -u origin main
