name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          if [ -f "CN-Upscaler-GitHub-Ready.zip" ]; then
            unzip -o CN-Upscaler-GitHub-Ready.zip
          elif [ -f "cnupscaler.zip" ]; then
            unzip -o cnupscaler.zip
          fi
          
          if [ -d "cnupscaler" ]; then
            cp -rf cnupscaler/* .
            cp -rf cnupscaler/.* . 2>/dev/null || true
          fi
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cnupscaler-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
